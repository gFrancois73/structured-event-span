[project]
name = "structured-event-span"
version = "0.1.1"
description = "A context manager that records nested operation spans with start time, end time, duration, and arbitrary metadata into a tree for export to tracing backends."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
